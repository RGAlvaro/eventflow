[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eventflow"
version = "0.1.0"
description = "Durable multitenant event ingestion and webhook delivery"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.15,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.8,<3",
    "psycopg[binary]>=3.2,<4",
    "redis>=5,<7",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn>=0.34,<1",
    "celery[redis]>=5.5,<6",
    "httpx>=0.28,<1",
    "cryptography>=44,<47",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.15,<2",
    "pytest>=8,<9",
    "pytest-asyncio>=0.26,<2",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eventflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
