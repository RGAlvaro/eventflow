services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: eventflow
      POSTGRES_USER: eventflow
      POSTGRES_PASSWORD: eventflow
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventflow -d eventflow"]
      interval: 2s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 20

  api:
    build: .
    environment:
      EVENTFLOW_ENVIRONMENT: development
      EVENTFLOW_DATABASE_URL: postgresql+asyncpg://eventflow:eventflow@postgres:5432/eventflow
      EVENTFLOW_REDIS_URL: redis://redis:6379/0
      EVENTFLOW_ENCRYPTION_KEYS: ${EVENTFLOW_ENCRYPTION_KEYS:?Set development encryption keys}
      EVENTFLOW_ACTIVE_ENCRYPTION_KEY_ID: ${EVENTFLOW_ACTIVE_ENCRYPTION_KEY_ID:?Set active key ID}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 5s
      retries: 12
    command: ["uvicorn", "eventflow.app:app", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    build: .
    environment:
      EVENTFLOW_ENVIRONMENT: development
      EVENTFLOW_DATABASE_URL: postgresql+asyncpg://eventflow:eventflow@postgres:5432/eventflow
      EVENTFLOW_REDIS_URL: redis://redis:6379/0
      EVENTFLOW_ENCRYPTION_KEYS: ${EVENTFLOW_ENCRYPTION_KEYS:?Set development encryption keys}
      EVENTFLOW_ACTIVE_ENCRYPTION_KEY_ID: ${EVENTFLOW_ACTIVE_ENCRYPTION_KEY_ID:?Set active key ID}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "eventflow.worker:celery_app", "worker", "--loglevel=INFO", "--concurrency=4"]

  dispatcher:
    build: .
    environment:
      EVENTFLOW_ENVIRONMENT: development
      EVENTFLOW_DATABASE_URL: postgresql+asyncpg://eventflow:eventflow@postgres:5432/eventflow
      EVENTFLOW_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "eventflow.worker"]

volumes:
  postgres_data:
